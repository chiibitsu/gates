# Part of chiibitsu/gates by Angeline S. Viray (Chiibitsu Labs). MIT. https://github.com/chiibitsu/gates
# Copy this to .github/workflows/gates.yml in your repo. The SHA below appears twice on
# purpose: a reusable workflow cannot discover its own commit, so the ref you pin has to be
# handed to it. Change both together.
#
# It does NOT name the release you are reading, and cannot: a commit cannot contain its own
# SHA. What it does name is not derivable — from v1.0.2 onward it is the previous release, but
# v1.0.0 and v1.0.1 pinned untagged ancestors, and v1.0.1 labelled its untagged pin with its
# own version number. So take the SHA you want from the Releases table in the README, never
# from this line. The one below is v1.0.3, whose gates are correct and identical to the
# current release's, though its own metadata names the wrong version.
on: [pull_request, push]
jobs:
  gates:
    uses: chiibitsu/gates/.github/workflows/gates.yml@25a1ca1f7ad7875138dd943657a5f7f1a3aa1809 # v1.0.3
    with:
      gates_ref: 25a1ca1f7ad7875138dd943657a5f7f1a3aa1809 # v1.0.3
