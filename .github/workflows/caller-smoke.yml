name: caller-smoke
# Uses this repo AS a consumer, so the reusable workflow is exercised rather than
# assumed. An untested reusable workflow is a gate nobody has seen work — the same
# defect the toolkit exists to refuse, one level up.
#
# The pinned SHA is v1.0.0. It is deliberately a fixed commit and not the branch head:
# that is exactly what a consumer does, and it also proves the toolkit's
# github.job_workflow_sha resolution returns the commit the caller pinned.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  gates:
    uses: chiibitsu/gates/.github/workflows/gates.yml@186ff054aebc0b3f581ae079e6fad4035e36f2d0
