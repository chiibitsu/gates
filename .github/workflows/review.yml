name: review
# Part of chiibitsu/gates by Angeline S. Viray (Chiibitsu Labs). MIT. https://github.com/chiibitsu/gates
#
# REUSABLE workflow. The DRAFT-STAGE reviewer: a model reads the diff against REVIEW.md while
# the pull request is still a draft, so the findings arrive before anyone is asked to look.
#
# It is Tier 2 and it is NOT a gate. Nothing here is deterministic and nothing here should ever
# be a required check. The deterministic gates in gates.yml are the ones that block; this reads
# what they cannot.
#
# WHILE THE PR IS A DRAFT, and only then. The job's `if` is the whole policy: a draft is where
# a review is cheap to act on, and this repo has already been bitten by the opposite arrangement
# — a security lane guarded on `draft == false` produced NO CHECK AT ALL on every draft PR, and
# a missing check leaves no mark to notice. Here the absence is deliberate and stated: on a
# ready PR this job reports `skipped`, which is not a pass and is not claimed as one.
#
# Every third-party action is pinned to a full commit SHA. The pin below is deliberately NOT the
# SHA that `@v1` currently resolves to: `v1` is a moving pointer and, measured on 2026-09-08, it
# pointed at b7912ae, which is not the commit of any concrete release. A patch tag does not move,
# so the pin names one.
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: >-
          OAuth token for a Claude subscription, from `claude setup-token`. Required: without it
          the action cannot authenticate and the job fails loudly rather than reviewing nothing.
        required: true

# As in the documented review example: the action authenticates as the Claude GitHub App for its
# own inline comments, so it does not need write here. `pull-requests: write` is for the tally
# step below, which posts as GITHUB_TOKEN precisely so that it still posts when the model does
# not.
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Draft review
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The reviewer reads a range, so it needs both ends of it.
          fetch-depth: 0

      - name: Review the diff against REVIEW.md
        id: review
        continue-on-error: true
        uses: anthropics/claude-code-action@ef7878a0506921197f7f9cd8a6c8dc7b11497021 # v1.0.217
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # REVIEW.md is named here on purpose. The managed Code Review service reads that file
          # from the repository root by itself; this action does NOT, so the prompt loads it.
          prompt: |
            You are reviewing a draft pull request in this repository.

            1. Read REVIEW.md at the repository root and follow it exactly. It defines what
               Important means here, caps nits, lists what not to report, and sets the
               verification bar. Where it and your own judgement disagree, it wins.
            2. Read the diff: `git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}`.
            3. REPRODUCE EACH FINDING BEFORE POSTING IT. Open the file, read the body, and state
               the input or state that produces the wrong result. A claim inferred from a name
               is not a finding. If you cannot reproduce it, drop it.
            4. Post each surviving finding as an inline comment on the line it is about, using
               mcp__github_inline_comment__create_inline_comment. Every comment carries its
               severity (Important or Nit), the reproduction, and a proposed fix as a diff.
            5. If this pull request already has review comments from an earlier run of yours,
               this is a re-review: post IMPORTANT FINDINGS ONLY, and for each earlier finding
               say whether it is addressed or withdrawn rather than reposting it.
            6. Last, write the number of findings you posted — a bare integer and nothing else —
               to the file `.review-findings-count` in the repository root. Write `0` if you
               posted none. The workflow reads that file to post the run's tally, so a run that
               does not write it is reported as UNKNOWN rather than as clean.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"

      # ALWAYS, and deliberately not the model's job. The tally is the one thing a reader uses to
      # tell "reviewed, nothing found" from "did not review", so it cannot depend on the reviewer
      # finishing. If the count file is missing or unparseable the run says UNKNOWN and goes RED:
      # there is no third colour, and a reviewer that died is not a clean bill of health.
      - name: Post the tally
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          set -euo pipefail
          short="${HEAD_SHA:0:7}"
          count=""
          if [ -f .review-findings-count ]; then
            count="$(tr -dc '0-9' < .review-findings-count | head -c 6)"
          fi
          if [ -z "$count" ]; then
            line="reviewed $short: UNKNOWN — the reviewer did not report a count (step outcome: $REVIEW_OUTCOME)"
            gh pr comment "$PR" --body "$line"
            echo "UNKNOWN [review] $line"
            echo "::error title=UNKNOWN (review)::$line"
            exit 1
          fi
          if [ "$count" = "1" ]; then
            line="reviewed $short: 1 finding"
          else
            line="reviewed $short: $count findings"
          fi
          gh pr comment "$PR" --body "$line"
          echo "$line"
          if [ "$REVIEW_OUTCOME" != "success" ]; then
            echo "::error title=UNKNOWN (review)::the reviewer step ended '$REVIEW_OUTCOME'; the tally above may be incomplete"
            exit 1
          fi
