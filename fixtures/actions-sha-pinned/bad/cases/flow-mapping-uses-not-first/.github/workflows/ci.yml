# Two shapes the anchored matcher could not see even after it learned about `{`: `uses` as
# something other than the FIRST key of a flow mapping, and more than one step on one line.
# Three mutable tags here; the previous version reported none of them.
name: ci
on: [push]
jobs:
  x:
    steps:
      - {name: build, uses: actions/checkout@v4}
  y:
    steps: [{uses: actions/setup-node@main}, {uses: some/other@v1}]
